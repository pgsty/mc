version: 2

project_name: mc

env:
  - CGO_ENABLED=0
  - GO111MODULE=on

before:
  hooks:
    - make clean
    - go generate ./...
    - go mod download
    - go mod verify
    - go run ./buildscripts/check-dependency-floors
    - make check-credits

builds:
  - id: mcli
    main: .
    binary: mcli
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    flags:
      - -tags=kqueue
      - -trimpath
    ldflags:
      - "{{ .Env.LDFLAGS }}"

archives:
  - id: mcli
    ids:
      - mcli
    name_template: "mcli_{{ .Env.PKG_VERSION }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - CREDITS
      - README.md
      - README_ZH.md

checksum:
  name_template: "mcli_{{ .Env.PKG_VERSION }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: pgsty
    name: mc
  draft: true
  prerelease: false
  replace_existing_draft: true
  replace_existing_artifacts: false
  mode: replace
  # Draft replacement matches the release name; keep it identical to the tag.
  name_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

announce:
  skip: true
