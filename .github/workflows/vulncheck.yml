name: VulnCheck
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # A fork of an archived upstream can go weeks without a commit. Without a
  # schedule, a vulnerability disclosed against a pinned dependency would not
  # surface until someone happened to open a pull request.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash
