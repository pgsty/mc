name: Test Release Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/goreleaser.yml"
      - ".github/nfpm.yml"
      - "Dockerfile.goreleaser"
      - "buildscripts/package-release.sh"
      - "buildscripts/sign-release-rpms.sh"
      - "buildscripts/verify-build-provenance.sh"
      - "buildscripts/gen-ldflags.go"
      - ".github/workflows/docker-release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-release.yml"
      - ".gitignore"
      - "Makefile"
      - "CREDITS"
      - "NOTICE"
      - "buildscripts/gen-credits.sh"
      - "buildscripts/license-overrides/**"
      - "buildscripts/check-dependency-floors/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute test variables
        run: |
          set -euo pipefail
          RELEASE_TAG="RELEASE.2026-02-14T12-00-00Z"
          VERSION_COLON="2026-02-14T12:00:00Z"
          PKG_VERSION="20260214120000.0.0"
          LDFLAGS="$(MC_RELEASE=RELEASE go run buildscripts/gen-ldflags.go "${VERSION_COLON}")"
          {
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "PKG_VERSION=${PKG_VERSION}"
            echo "LDFLAGS=${LDFLAGS}"
          } >> "${GITHUB_ENV}"
          echo "PKG_VERSION: ${PKG_VERSION}"
          echo "LDFLAGS: ${LDFLAGS}"

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check --config .github/goreleaser.yml

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish --config .github/goreleaser.yml
        env:
          LDFLAGS: ${{ env.LDFLAGS }}
          PKG_VERSION: ${{ env.PKG_VERSION }}

      - name: Verify binary provenance stamps
        run: |
          set -euo pipefail
          buildscripts/verify-build-provenance.sh

      - name: Verify archive documentation
        run: |
          set -euo pipefail
          count=0
          for archive in dist/mcli_*.tar.gz; do
            count=$((count + 1))
            listing="$(tar -tzf "${archive}")"
            for member in LICENSE NOTICE CREDITS README.md README_ZH.md; do
              grep -Fx "${member}" <<< "${listing}"
            done
          done
          test "${count}" -eq 6

      - name: Install package validation tools
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install --yes rpm binutils

      - name: Package snapshot binaries with nFPM
        run: |
          set -euo pipefail
          buildscripts/package-release.sh

      - name: Validate package names, checksums, metadata, and payload
        run: |
          set -euo pipefail
          cd dist/packages

          expected=(
            "mcli-${PKG_VERSION}-1.aarch64.rpm"
            "mcli-${PKG_VERSION}-1.x86_64.rpm"
            "mcli_${PKG_VERSION}_aarch64.apk"
            "mcli_${PKG_VERSION}_amd64.deb"
            "mcli_${PKG_VERSION}_arm64.deb"
            "mcli_${PKG_VERSION}_x86_64.apk"
          )

          for package in "${expected[@]}"; do
            test -s "${package}"
            test -s "${package}.sha256sum"
            sha256sum --check "${package}.sha256sum"
          done

          test "$(find . -maxdepth 1 -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.apk' \) | wc -l)" -eq 6

          # sign-release-rpms.sh refuses to sign an RPM whose metadata does not
          # match these values, and it runs on a maintainer laptop *after* the
          # release workflow has already built and uploaded. Take its
          # expectations as the single source of truth so nfpm.yml and the
          # signing script cannot drift apart without failing here first.
          eval "$(grep -E '^expected_(vendor|packager|url|summary|description|license|group)=' \
            ../../buildscripts/sign-release-rpms.sh)"
          for value in "${expected_vendor}" "${expected_packager}" "${expected_url}" \
                       "${expected_summary}" "${expected_description}" \
                       "${expected_license}" "${expected_group}"; do
            test -n "${value}"
          done

          rpm_file="mcli-${PKG_VERSION}-1.x86_64.rpm"
          test "$(rpm -qp --queryformat '%{VENDOR}' "${rpm_file}")" = "${expected_vendor}"
          test "$(rpm -qp --queryformat '%{PACKAGER}' "${rpm_file}")" = "${expected_packager}"
          test "$(rpm -qp --queryformat '%{URL}' "${rpm_file}")" = "${expected_url}"
          test "$(rpm -qp --queryformat '%{SUMMARY}' "${rpm_file}")" = "${expected_summary}"
          test "$(rpm -qp --queryformat '%{DESCRIPTION}' "${rpm_file}")" = "${expected_description}"
          test "$(rpm -qp --queryformat '%{LICENSE}' "${rpm_file}")" = "${expected_license}"
          test "$(rpm -qp --queryformat '%{GROUP}' "${rpm_file}")" = "${expected_group}"
          rpm -qpl "${rpm_file}" | grep -Fx '/usr/local/bin/mcli'

          deb_file="mcli_${PKG_VERSION}_amd64.deb"
          test "$(dpkg-deb --field "${deb_file}" Maintainer)" = "${expected_packager}"
          test "$(dpkg-deb --field "${deb_file}" Version)" = "${PKG_VERSION}"
          test "$(dpkg-deb --field "${deb_file}" License)" = "${expected_license}"
          test "$(dpkg-deb --field "${deb_file}" Section)" = "utils"
          test "$(dpkg-deb --field "${deb_file}" Homepage)" = "${expected_url}"
          test "$(dpkg-deb --field "${deb_file}" Description)" = "${expected_description}"
          dpkg-deb --contents "${deb_file}" | grep -E 'usr/local/bin/mcli$'

          apk_info="$(tar -xOzf "mcli_${PKG_VERSION}_x86_64.apk" .PKGINFO)"
          grep -Fx "pkgver = ${PKG_VERSION}" <<< "${apk_info}"
          grep -Fx "url = ${expected_url}" <<< "${apk_info}"
          grep -Fx "maintainer = ${expected_packager}" <<< "${apk_info}"
          grep -Fx "license = ${expected_license}" <<< "${apk_info}"
          grep -Fx "pkgdesc = ${expected_description}" <<< "${apk_info}"
          tar -tzf "mcli_${PKG_VERSION}_x86_64.apk" | grep -Fx 'usr/local/bin/mcli'

          for arch in amd64 arm64; do
            if [ "${arch}" = amd64 ]; then
              rpm_arch=x86_64
              deb_arch=amd64
              apk_arch=x86_64
            else
              rpm_arch=aarch64
              deb_arch=arm64
              apk_arch=aarch64
            fi

            rpm_package="mcli-${PKG_VERSION}-1.${rpm_arch}.rpm"
            deb_package="mcli_${PKG_VERSION}_${deb_arch}.deb"
            apk_package="mcli_${PKG_VERSION}_${apk_arch}.apk"

            rpm -qpl "${rpm_package}" | grep -Fx '/usr/share/licenses/mcli/LICENSE'
            rpm -qpl "${rpm_package}" | grep -Fx '/usr/share/doc/mcli/NOTICE'
            rpm -qpl "${rpm_package}" | grep -Fx '/usr/share/doc/mcli/CREDITS'
            dpkg-deb --contents "${deb_package}" | grep -E 'usr/share/licenses/mcli/LICENSE$'
            dpkg-deb --contents "${deb_package}" | grep -E 'usr/share/doc/mcli/NOTICE$'
            dpkg-deb --contents "${deb_package}" | grep -E 'usr/share/doc/mcli/CREDITS$'
            tar -tzf "${apk_package}" | grep -Fx 'usr/share/licenses/mcli/LICENSE'
            tar -tzf "${apk_package}" | grep -Fx 'usr/share/doc/mcli/NOTICE'
            tar -tzf "${apk_package}" | grep -Fx 'usr/share/doc/mcli/CREDITS'

            test "$(rpm -qp --queryformat '%{ARCH}' "mcli-${PKG_VERSION}-1.${rpm_arch}.rpm")" = "${rpm_arch}"
            test "$(dpkg-deb --field "mcli_${PKG_VERSION}_${deb_arch}.deb" Architecture)" = "${deb_arch}"
            grep -Fx "arch = ${apk_arch}" <<< "$(tar -xOzf "mcli_${PKG_VERSION}_${apk_arch}.apk" .PKGINFO)"

            source_binary="$(find .. -maxdepth 2 -type f -path "../mcli_linux_${arch}*/mcli" | head -n 1)"
            source_sha="$(sha256sum "${source_binary}" | awk '{print $1}')"

            # Do not pipe rpm2cpio here: Debian's build exits non-zero even when
            # it writes a correct payload, which trips `set -o pipefail` and made
            # this whole step unrunnable on ubuntu-latest. Use rpm's own digests
            # instead -- -K checks the payload against the header, and
            # FILEDIGESTS is the sha256 rpm itself verifies on install.
            rpm -K "mcli-${PKG_VERSION}-1.${rpm_arch}.rpm"
            rpm_sha="$(rpm -qp --queryformat '[%{FILENAMES} %{FILEDIGESTS}\n]' \
              "mcli-${PKG_VERSION}-1.${rpm_arch}.rpm" | awk '$1 == "/usr/local/bin/mcli" { print $2 }')"
            deb_sha="$(ar p "mcli_${PKG_VERSION}_${deb_arch}.deb" data.tar.gz | tar -xzOf - ./usr/local/bin/mcli | sha256sum | awk '{print $1}')"
            apk_sha="$(tar -xzOf "mcli_${PKG_VERSION}_${apk_arch}.apk" usr/local/bin/mcli | sha256sum | awk '{print $1}')"

            test "${source_sha}" = "${rpm_sha}"
            test "${source_sha}" = "${deb_sha}"
            test "${source_sha}" = "${apk_sha}"
          done

      # docker-release.yml is workflow_dispatch only, so Dockerfile.goreleaser is
      # otherwise never built until a real publish. Assemble the same context it
      # builds and exercise the image here, without pushing anything.
      - name: Build release container image (no push)
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          tar -xzf "dist/mcli_${PKG_VERSION}_linux_amd64.tar.gz" -C "${context}" mcli
          mv "${context}/mcli" "${context}/mc"
          cp Dockerfile.goreleaser LICENSE NOTICE CREDITS "${context}/"
          docker build --tag mcli-release-test:snapshot \
            --file "${context}/Dockerfile.goreleaser" "${context}"
          docker run --rm mcli-release-test:snapshot --version
          docker image inspect mcli-release-test:snapshot \
            --format '{{ index .Config.Labels "org.opencontainers.image.vendor" }}' | grep -Fx PGSTY

      - name: Validate release scripts
        run: |
          set -euo pipefail
          bash -n buildscripts/package-release.sh
          bash -n buildscripts/sign-release-rpms.sh
          bash -n buildscripts/verify-build-provenance.sh
          test -x buildscripts/package-release.sh
          test -x buildscripts/sign-release-rpms.sh
          test -x buildscripts/verify-build-provenance.sh
