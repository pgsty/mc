name: Test Release Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/goreleaser.yml"
      - ".github/nfpm.yml"
      - "Dockerfile.goreleaser"
      - "buildscripts/package-release.sh"
      - "buildscripts/sign-release-rpms.sh"
      - ".github/workflows/docker-release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/test-release.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute test variables
        run: |
          set -euo pipefail
          RELEASE_TAG="RELEASE.2026-02-14T12-00-00Z"
          VERSION_COLON="2026-02-14T12:00:00Z"
          PKG_VERSION="20260214120000.0.0"
          LDFLAGS="$(MC_RELEASE=RELEASE go run buildscripts/gen-ldflags.go "${VERSION_COLON}")"
          {
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "PKG_VERSION=${PKG_VERSION}"
            echo "LDFLAGS=${LDFLAGS}"
          } >> "${GITHUB_ENV}"
          echo "PKG_VERSION: ${PKG_VERSION}"
          echo "LDFLAGS: ${LDFLAGS}"

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.1
          args: check --config .github/goreleaser.yml

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish --config .github/goreleaser.yml
        env:
          LDFLAGS: ${{ env.LDFLAGS }}
          PKG_VERSION: ${{ env.PKG_VERSION }}

      - name: Install package validation tools
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install --yes cpio rpm

      - name: Package snapshot binaries with nFPM
        run: |
          set -euo pipefail
          buildscripts/package-release.sh

      - name: Validate package names, checksums, metadata, and payload
        run: |
          set -euo pipefail
          cd dist/packages

          expected=(
            "mcli-${PKG_VERSION}-1.aarch64.rpm"
            "mcli-${PKG_VERSION}-1.x86_64.rpm"
            "mcli_${PKG_VERSION}_aarch64.apk"
            "mcli_${PKG_VERSION}_amd64.deb"
            "mcli_${PKG_VERSION}_arm64.deb"
            "mcli_${PKG_VERSION}_x86_64.apk"
          )

          for package in "${expected[@]}"; do
            test -s "${package}"
            test -s "${package}.sha256sum"
            sha256sum --check "${package}.sha256sum"
          done

          test "$(find . -maxdepth 1 -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.apk' \) | wc -l)" -eq 6
          test "$(rpm -qp --queryformat '%{VENDOR}' "mcli-${PKG_VERSION}-1.x86_64.rpm")" = "PGSTY"
          test "$(rpm -qp --queryformat '%{PACKAGER}' "mcli-${PKG_VERSION}-1.x86_64.rpm")" = "Ruohang Feng (@Vonng) <rh@vonng.com>"
          test "$(rpm -qp --queryformat '%{URL}' "mcli-${PKG_VERSION}-1.x86_64.rpm")" = "https://silo.pgsty.com"
          test "$(rpm -qp --queryformat '%{GROUP}' "mcli-${PKG_VERSION}-1.x86_64.rpm")" = "Applications/File"
          rpm -qpl "mcli-${PKG_VERSION}-1.x86_64.rpm" | grep -Fx '/usr/local/bin/mcli'

          test "$(dpkg-deb --field "mcli_${PKG_VERSION}_amd64.deb" Maintainer)" = "Ruohang Feng (@Vonng) <rh@vonng.com>"
          test "$(dpkg-deb --field "mcli_${PKG_VERSION}_amd64.deb" Version)" = "${PKG_VERSION}"
          test "$(dpkg-deb --field "mcli_${PKG_VERSION}_amd64.deb" License)" = "AGPLv3"
          test "$(dpkg-deb --field "mcli_${PKG_VERSION}_amd64.deb" Homepage)" = "https://silo.pgsty.com"
          dpkg-deb --contents "mcli_${PKG_VERSION}_amd64.deb" | grep -E 'usr/local/bin/mcli$'

          apk_info="$(tar -xOzf "mcli_${PKG_VERSION}_x86_64.apk" .PKGINFO)"
          grep -Fx "pkgver = ${PKG_VERSION}" <<< "${apk_info}"
          grep -Fx 'url = https://silo.pgsty.com' <<< "${apk_info}"
          tar -tzf "mcli_${PKG_VERSION}_x86_64.apk" | grep -Fx 'usr/local/bin/mcli'

          for arch in amd64 arm64; do
            if [ "${arch}" = amd64 ]; then
              rpm_arch=x86_64
              deb_arch=amd64
              apk_arch=x86_64
            else
              rpm_arch=aarch64
              deb_arch=arm64
              apk_arch=aarch64
            fi

            source_binary="$(find .. -maxdepth 2 -type f -path "../mcli_linux_${arch}*/mcli" | head -n 1)"
            source_sha="$(sha256sum "${source_binary}" | awk '{print $1}')"
            rpm_sha="$(rpm2cpio "mcli-${PKG_VERSION}-1.${rpm_arch}.rpm" | cpio --quiet -i --to-stdout /usr/local/bin/mcli | sha256sum | awk '{print $1}')"
            deb_sha="$(ar p "mcli_${PKG_VERSION}_${deb_arch}.deb" data.tar.gz | tar -xzOf - ./usr/local/bin/mcli | sha256sum | awk '{print $1}')"
            apk_sha="$(tar -xzOf "mcli_${PKG_VERSION}_${apk_arch}.apk" usr/local/bin/mcli | sha256sum | awk '{print $1}')"

            test "${source_sha}" = "${rpm_sha}"
            test "${source_sha}" = "${deb_sha}"
            test "${source_sha}" = "${apk_sha}"
          done

      - name: Validate release scripts
        run: |
          set -euo pipefail
          bash -n buildscripts/package-release.sh
          bash -n buildscripts/sign-release-rpms.sh
