name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede an earlier run of the same pull request or branch. github.head_ref
# is empty outside pull_request, so keying on it alone would drop every push
# and manual dispatch into one shared group where they cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [1.27.1]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'windows-latest'
        # bash, not pwsh: pwsh only propagates the last command's exit code,
        # and %GOPATH% is a cmd.exe form that pwsh leaves unexpanded.
        shell: bash
        run: |
          go build --ldflags="-s -w" -o "$(go env GOPATH)/bin/mc.exe"
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'macos-latest'
        run: |
          go build --ldflags="-s -w" -o "$(go env GOPATH)/bin/mc"
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        env:
          ACCESS_KEY: minioadmin
          SECRET_KEY: minioadmin
          ENABLE_HTTPS: 1
          MINIO_CI_CD: 1
          SERVER_ENDPOINT: localhost:9000
          MC_TEST_ENABLE_HTTPS: true
          MC_TEST_SKIP_INSECURE: true
          MC_TEST_SKIP_BUILD: true
          SILO_RELEASE: RELEASE.2026-09-03T13-18-01Z
          SILO_ARCHIVE: silo_20260903131801.0.0_linux_amd64.tar.gz
          SILO_ARCHIVE_SHA256: cbe5c01eac0a97ccb22fa252eafa432e8608bfde7e3ea27a324cb5ed625a1e96
        run: |
          curl -fsSLO "https://github.com/pgsty/silo/releases/download/${SILO_RELEASE}/${SILO_ARCHIVE}"
          echo "${SILO_ARCHIVE_SHA256}  ${SILO_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${SILO_ARCHIVE}" silo
          test -x silo
          mkdir -p ~/.minio/certs/ && cp testdata/localhost.crt ~/.minio/certs/public.crt && cp testdata/localhost.key ~/.minio/certs/private.key
          sudo cp testdata/localhost.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates
          ./silo server /tmp/test-xl/{1...4}/ & sleep 10
          make
          make test-race
          make verify
          ./functional-tests.sh
  vetchecks: # Run vet checks against one version.
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release build no longer runs `go mod tidy`, so drift has to be
      # caught here instead of being silently applied while cutting a release.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Reject dependency floor regressions
        run: go run ./buildscripts/check-dependency-floors

      - name: Check third-party credits
        run: make check-credits

      # Brand policy gate: user-visible surfaces must keep the Silo identity
      # and never reintroduce MinIO endpoints or commercial upsell, while
      # protocol-compatibility identifiers stay untouched.
      - name: Check branding policy
        run: bash buildscripts/check-branding.sh

      - name: Test 386
        run: GOOS=linux GOARCH=386 go test -short ./...
