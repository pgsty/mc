name: Go

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [1.26.5]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'windows-latest'
        run: |
          go build --ldflags="-s -w" -o %GOPATH%\bin\mc.exe
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'macos-latest'
        run: |
          go build --ldflags="-s -w" -o %GOPATH%\bin\mc
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        env:
          ACCESS_KEY: minioadmin
          SECRET_KEY: minioadmin
          ENABLE_HTTPS: 1
          MINIO_CI_CD: 1
          SERVER_ENDPOINT: localhost:9000
          MC_TEST_ENABLE_HTTPS: true
          MC_TEST_SKIP_INSECURE: true
          MC_TEST_SKIP_BUILD: true
          MINIO_RELEASE: RELEASE.2026-06-18T00-00-00Z
          MINIO_ARCHIVE: minio_20260618000000.0.0_linux_amd64.tar.gz
          MINIO_ARCHIVE_SHA256: 0ba637b050be30d8c65142798c363cfb7392bf731d2f572aefd2e7bf1fd59a10
        run: |
          curl -fsSLO "https://github.com/pgsty/minio/releases/download/${MINIO_RELEASE}/${MINIO_ARCHIVE}"
          echo "${MINIO_ARCHIVE_SHA256}  ${MINIO_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${MINIO_ARCHIVE}"
          test -x minio
          mkdir -p ~/.minio/certs/ && cp testdata/localhost.crt ~/.minio/certs/public.crt && cp testdata/localhost.key ~/.minio/certs/private.key
          sudo cp testdata/localhost.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates
          ./minio server /tmp/test-xl/{1...4}/ & sleep 10
          make
          make test-race
          make verify
          ./functional-tests.sh
  vetchecks: # Run vet checks against one version.
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.5

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release build no longer runs `go mod tidy`, so drift has to be
      # caught here instead of being silently applied while cutting a release.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test 386
        run: GOOS=linux GOARCH=386 go test -short ./...
