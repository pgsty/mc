name: mcli
arch: ${NFPM_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${NFPM_RELEASE}
section: utils
priority: optional
maintainer: "Ruohang Feng (@Vonng) <rh@vonng.com>"
description: Silo object storage client (mcli), a community-maintained fork of the MinIO Client.
vendor: PGSTY
homepage: https://silo.pgsty.com
license: AGPL-3.0-or-later

contents:
  - src: ${NFPM_SOURCE}
    dst: /usr/local/bin/mcli
    expand: true
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: LICENSE
    dst: /usr/share/licenses/mcli/LICENSE
    type: license
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/mcli/LICENSE
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/mcli/LICENSE
    packager: apk
  - src: NOTICE
    dst: /usr/share/doc/mcli/NOTICE
    type: doc
    packager: rpm
  - src: NOTICE
    dst: /usr/share/doc/mcli/NOTICE
    packager: deb
  - src: NOTICE
    dst: /usr/share/doc/mcli/NOTICE
    packager: apk
  - src: CREDITS
    dst: /usr/share/doc/mcli/CREDITS
    type: doc
    packager: rpm
  - src: CREDITS
    dst: /usr/share/doc/mcli/CREDITS
    packager: deb
  - src: CREDITS
    dst: /usr/share/doc/mcli/CREDITS
    packager: apk

rpm:
  group: Applications/File
  compression: gzip:9

deb:
  compression: gzip
  fields:
    License: AGPL-3.0-or-later
