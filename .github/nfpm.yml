name: mcli
arch: ${NFPM_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${NFPM_RELEASE}
section: utils
priority: optional
maintainer: "Ruohang Feng (@Vonng) <rh@vonng.com>"
description: S3-Interface Libre Object Storage, Community-maintained MinIO client fork.
vendor: PGSTY
homepage: https://silo.pgsty.com
license: AGPL-3.0-or-later

contents:
  - src: ${NFPM_SOURCE}
    dst: /usr/local/bin/mcli
    expand: true
    file_info:
      mode: 0755
      owner: root
      group: root

rpm:
  group: Applications/File
  compression: gzip:9

deb:
  compression: gzip
  fields:
    License: AGPL-3.0-or-later
