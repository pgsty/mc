version: 2

updates:
  # Workflow actions are pinned to commit SHAs so a moving tag cannot change
  # what runs in the release pipeline. Dependabot keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
