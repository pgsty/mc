version: 2

updates:
  # Workflow actions are pinned to commit SHAs so a moving tag cannot change
  # what runs in the release pipeline. Dependabot keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Dockerfile.goreleaser pins its UBI bases by digest so a release tag always
  # rebuilds the same image. Without this the pins would silently rot and stop
  # receiving base-image CVE fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
