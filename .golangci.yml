version: "2"
linters:
  default: none
  enable:
    - gomodguard_v2
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    # The fork imports the SILO package under its own path. Upstream minio/pkg
    # survives only as an indirect dependency of github.com/minio/colorjson,
    # and importing it here would silently reintroduce a policy parser that
    # accepts bare ARNs. Block the path so it cannot creep back in.
    gomodguard_v2:
      blocked:
        - module: github.com/minio/pkg/v3
          recommendations:
            - github.com/pgsty/silo-pkg/v3
          reason: "this fork uses the SILO package under its own module path"
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: instead of using struct literal
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: error strings should not be capitalized or end with punctuation or a newline
      - path: (.+)\.go$
        text: error strings should not end with punctuation or newlines
      - path: (.+)\.go$
        text: error strings should not be capitalized
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
